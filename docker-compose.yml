services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dmflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dmflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dmflow:${POSTGRES_PASSWORD}@db:5432/dmflow
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      target: web
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dmflow:${POSTGRES_PASSWORD}@db:5432/dmflow
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  worker:
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dmflow:${POSTGRES_PASSWORD}@db:5432/dmflow
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 60s
  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: dmflow
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: dmflow
      BACKUP_RETENTION_DAYS: 14
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - backups:/backups
    command: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  backups:
